services:
  db:
    image: mariadb:11.4
    container_name: woo-app-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: wordpress:php8.2-fpm
    container_name: woo-app-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER:?set MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      APP_HOST: ${APP_HOST:?set APP_HOST}
      APP_SCHEME: ${APP_SCHEME:-https}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?set WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?set WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?set WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?set WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?set WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?set WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?set WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?set WORDPRESS_NONCE_SALT}
      WORDPRESS_CONFIG_EXTRA: |
        $$confi_host = getenv('APP_HOST') ?: ($$_SERVER['HTTP_HOST'] ?? 'localhost');
        $$confi_scheme = getenv('APP_SCHEME') ?: 'https';
        define('WP_HOME', $$confi_scheme . '://' . $$confi_host);
        define('WP_SITEURL', $$confi_scheme . '://' . $$confi_host);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - ./wordpress_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - default
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: woo-app-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./wordpress_data:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: woo-app_default
